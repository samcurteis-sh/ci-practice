name: Build and Deploy

on:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Environment
        default: nonprod

env:
  REGISTRY: ghcr.io/samcurteis-sh/ci-practice

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }} # Pass image tag to deploy job

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/web
          tags: |
            type=edge
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'sandbox' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            manifest.yaml
          sparse-checkout-cone-mode: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set container app name
        id: container_app_name
        run: |
          NAME="ci-practice"
          if [[ "${{ contains(inputs.environment, 'sandbox') }}" == "true" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
            NAME="${NAME}-${ENVIRONMENT#sandbox-}"
          fi
          echo "value=$NAME" >> $GITHUB_OUTPUT

      - name: Deploy Container App
        uses: ./.github/actions/deploy/container
        with:
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ steps.container_app_name.outputs.value }}
          manifestFilePath: ./manifest.yaml
          overwriteManifest: true
          customDomain: ${{ vars.ONBOARDING_APP_DOMAIN || ''}}
          environmentUri: ${{ vars.AZURE_ENVIRONMENT_ID }}
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
