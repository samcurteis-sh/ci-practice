name: Test, Build and Deploy

on:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Environment
        default: sandbox

env:
  REGISTRY: ghcr.io/samcurteis-sh/ci-practice

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app1_changed: ${{ steps.changes.outputs.app1_changed }}
      app2_changed: ${{ steps.changes.outputs.app2_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^(shared/|package\.json|tsconfig\.json)'; then
            echo "app1_changed=true" >> $GITHUB_OUTPUT
            echo "app2_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -q '^apps/app1/'; then
            echo "app1_changed=true" >> $GITHUB_OUTPUT
          else
            echo "app1_changed=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -q '^apps/app2/'; then
            echo "app2_changed=true" >> $GITHUB_OUTPUT
          else
            echo "app2_changed=false" >> $GITHUB_OUTPUT
          fi

  test:
        runs-on: ubuntu-latest
        needs: detect-changes
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Clean install
              run: |
                  rm -rf node_modules package-lock.json
                  npm install

            - name: Lint
              run: npm run lint

            - name: Run tests with coverage
              run: |
                APP1="${{ steps.detect.outputs.app1_changed }}"
                APP2="${{ steps.detect.outputs.app2_changed }}"

                if [ "$APP1" = "true" ] && [ "$APP2" = "true" ]; then
                  echo "Both apps changed — running all tests"
                  TEST_DIRS=""
                else
                  TEST_DIRS=""
                  if [ "$APP1" = "true" ]; then
                    TEST_DIRS="$TEST_DIRS apps/app1"
                  fi
                  if [ "$APP2" = "true" ]; then
                    TEST_DIRS="$TEST_DIRS apps/app2"
                  fi
                fi

                if [ -z "$TEST_DIRS" ] && [ "$APP1" != "true" ] && [ "$APP2" != "true" ]; then
                  echo "No changes detected for App1 or App2 — skipping tests."
                  exit 0
                fi

                echo "Running tests in: ${TEST_DIRS:-'entire repo'}"
                npx vitest run --coverage.enabled --coverage.provider=istanbul \
                  --coverage.reporter=html --coverage.reporter=text $TEST_DIRS
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                name: coverage-report
                path: coverage
                retention-days: 30
            - name: Install Playwright Browsers
              if: needs.detect-changes.outputs.app1_changed || needs.detect-changes.outputs.app2_changed
              run: npx playwright install --with-deps
            - name: Run app1 locally
              if: needs.detect-changes.outputs.app1_changed
              env: 
                CONFIG_VARIABLE: "this comes from the workflow app1"
              run: npm run dev:app1 & npx wait-on http://localhost:3000
            - name: Run Playwright tests for app1
              if: needs.detect-changes.outputs.app1_changed
              run: npx playwright test apps/app1
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() && needs.detect-changes.outputs.app1_changed }}
              with:
                name: playwright-report-app1
                path: playwright-report/
                retention-days: 30  
            - name: Run app2 locally
              if: needs.detect-changes.outputs.app1_changed
              env: 
                CONFIG_VARIABLE: "this comes from the workflow app2"
              run: npm run dev:app2 & npx wait-on http://localhost:3001
            - name: Run Playwright tests for app2
              if: needs.detect-changes.outputs.app2_changed
              run: npx playwright test apps/app2
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() && needs.detect-changes.outputs.app2_changed }}
              with:
                name: playwright-report-app2
                path: playwright-report/
                retention-days: 30  
  build-app1:
    runs-on: ubuntu-latest
    needs: 
      - test
      - detect-changes
    if: needs.detect-changes.outputs.app1_changed
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }} # Pass image tag to deploy job

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/web
          tags: |
            type=edge
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/app1/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  deploy-app1:
    needs: build-app1
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'sandbox' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            manifest.yaml
          sparse-checkout-cone-mode: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set container app name
        id: container_app_name
        run: |
          NAME="ci-practice"
          if [[ "${{ contains(inputs.environment, 'sandbox') }}" == "true" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
            NAME="${NAME}-${ENVIRONMENT#sandbox-}"
          fi
          echo "value=$NAME" >> $GITHUB_OUTPUT

      - name: Deploy Container App
        uses: ./.github/actions/deploy/container
        with:
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ steps.container_app_name.outputs.value }}
          manifestFilePath: ./apps/app1/manifest.yaml
          overwriteManifest: true
          customDomain: ${{ vars.ONBOARDING_APP_DOMAIN || ''}}
          environmentUri: ${{ vars.AZURE_ENVIRONMENT_ID }}
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  build-app2:
    runs-on: ubuntu-latest
    needs: 
      - test
      - detect-changes
    if: needs.detect-changes.outputs.app2_changed
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }} # Pass image tag to deploy job

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/web
          tags: |
            type=edge
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/app2/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

  deploy-app2:
    needs: build-app2
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'sandbox' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            manifest.yaml
          sparse-checkout-cone-mode: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set container app name
        id: container_app_name
        run: |
          NAME="ci-practice"
          if [[ "${{ contains(inputs.environment, 'sandbox') }}" == "true" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
            NAME="${NAME}-${ENVIRONMENT#sandbox-}"
          fi
          echo "value=$NAME" >> $GITHUB_OUTPUT

      - name: Deploy Container App
        uses: ./.github/actions/deploy/container
        with:
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ steps.container_app_name.outputs.value }}
          manifestFilePath: ./apps/app2/manifest.yaml
          overwriteManifest: true
          customDomain: ${{ vars.ONBOARDING_APP_DOMAIN || ''}}
          environmentUri: ${{ vars.AZURE_ENVIRONMENT_ID }}
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
