name: Patient Onboarding Deploy

on:
    workflow_dispatch:
        inputs:
            environment:
                type: environment
                description: Environment
            version:
                type: string
                description: Image Tag
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment || 'nonprod' }}
        permissions:
            contents: read
            id-token: write
        outputs:
            APP_BASE_URL: ${{ steps.appconfig.outputs.app_base_url }}
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: |
                      .github/actions
                      manifest.yaml
                  sparse-checkout-cone-mode: false
            - name: Azure login
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Set container app name
              id: container_app_name
              run: |
                  NAME="patient-onboarding"
                  if [[ "${{ contains(inputs.environment, 'sandbox') }}" == "true" ]]; then
                    ENVIRONMENT="${{ inputs.environment }}"
                    NAME="${NAME}-${ENVIRONMENT#sandbox-}"
                  fi
                  echo "value=$NAME" >> $GITHUB_OUTPUT

            - name: Deploy Container App
              uses: ./.github/actions/deploy/container
              with:
                  resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
                  containerAppName: ${{ steps.container_app_name.outputs.value }}
                  manifestFilePath: ./manifest.yaml
                  overwriteManifest: true
                  customDomain: ${{ vars.ONBOARDING_APP_DOMAIN || ''}}
                  environmentUri: ${{ vars.AZURE_ENVIRONMENT_ID }}
                  subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}

