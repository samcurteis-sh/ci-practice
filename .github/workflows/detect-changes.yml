name: Detect changes

on:
  push:
    branches:
      - trunk

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            app1_changed: ${{ steps.changes.outputs.app1_changed }}
            app2_changed: ${{ steps.changes.outputs.app2_changed }}
        steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - id: changes
          run: |
            # Check which files have changed between commits
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Detect shared resource changes (adjust path as needed)
            if echo "$CHANGED_FILES" | grep -qE '^(shared/|package\.json|tsconfig\.json)'; then
                echo "Shared resources changed — deploying both apps."
                echo "app1_changed=true" >> $GITHUB_OUTPUT
                echo "app2_changed=true" >> $GITHUB_OUTPUT
                exit 0
            fi

            # Detect app-specific changes
            if echo "$CHANGED_FILES" | grep -q '^apps/app1/'; then
                echo "app1_changed=true" >> $GITHUB_OUTPUT
            else
                echo "app1_changed=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED_FILES" | grep -q '^apps/app2/'; then
                echo "app2_changed=true" >> $GITHUB_OUTPUT
            else
                echo "app2_changed=false" >> $GITHUB_OUTPUT
            fi